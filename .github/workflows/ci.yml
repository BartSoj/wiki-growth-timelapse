name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint
      - run: python3 -m py_compile scripts/*.py
      # The example wiki is invented, so this also proves the replay check passes end to end.
      - run: python3 scripts/make_example.py --out /tmp/example
      - run: python3 scripts/build_timeline.py /tmp/example --out /tmp/example.json
